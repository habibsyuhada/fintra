name: Deploy to VPS

# Auto-triggers disabled — run manually via "Run workflow" (workflow_dispatch)
# when needed.
on:
  workflow_dispatch:

jobs:
  # Runs only once the repository has the secrets below configured
  # (Settings -> Secrets and variables -> Actions). Until then this job
  # is skipped rather than failing the workflow.
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Rsync frontend build + compose files to VPS
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete
          path: frontend/dist/ docker-compose.yml deploy/
          remote_path: ${{ secrets.VPS_DEPLOY_PATH }}
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy backend (build + restart via docker compose)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            docker compose pull --ignore-pull-failures || true
            docker compose build backend
            docker compose up -d
            docker compose exec -T backend npx prisma migrate deploy

# Required repository configuration before this workflow does anything:
#   Variables: DEPLOY_ENABLED = "true"
#   Secrets:   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_DEPLOY_PATH
# Also requires a `production` environment with an .env file already present
# at VPS_DEPLOY_PATH on the server (see backend/.env.example), since this
# workflow does not manage secrets on the VPS itself.
