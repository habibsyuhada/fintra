name: Deploy to VPS

# Auto-triggers disabled — run manually via "Run workflow" (workflow_dispatch)
# when needed.
#
# The VPS does NOT use Docker: the backend runs directly under PM2
# (process name "fintra-backend"), and nginx + PostgreSQL run as native
# systemd services. This workflow deploys accordingly — do not reintroduce
# docker-compose here without also changing how the VPS actually runs.
on:
  workflow_dispatch:

jobs:
  # Runs only once the repository has the secrets below configured
  # (Settings -> Secrets and variables -> Actions). Until then this job
  # is skipped rather than failing the workflow.
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      # nginx's root on the VPS is <VPS_DEPLOY_PATH>/frontend/dist — keep
      # this in its own dedicated subfolder so --delete only ever prunes
      # stale build output, never anything else under VPS_DEPLOY_PATH.
      - name: Rsync frontend build to VPS
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete
          path: frontend/dist/
          remote_path: ${{ secrets.VPS_DEPLOY_PATH }}/frontend/dist/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      # .env, node_modules and dist live only on the VPS (not in this repo)
      # and must survive redeploys — they are excluded here, not deleted.
      - name: Rsync backend source to VPS
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete --exclude=.env --exclude=node_modules --exclude=dist
          path: backend/
          remote_path: ${{ secrets.VPS_DEPLOY_PATH }}/backend/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Install deps, build, migrate, restart backend (PM2)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}/backend
            npm ci
            npx prisma generate
            npm run build
            npx prisma migrate deploy
            pm2 restart fintra-backend

# Required repository configuration before this workflow does anything:
#   Variables: DEPLOY_ENABLED = "true"
#   Secrets:   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_DEPLOY_PATH
#     (VPS_DEPLOY_PATH is /var/www/fintra on the current production VPS)
# Also requires:
#   - a `production` environment
#   - <VPS_DEPLOY_PATH>/backend/.env already present on the server (see
#     backend/.env.example) — this workflow does not manage secrets on the VPS
#   - a PM2 process named "fintra-backend" already started on the VPS with
#     cwd <VPS_DEPLOY_PATH>/backend (e.g. `pm2 start dist/main.js --name
#     fintra-backend`), since this workflow only restarts it, it doesn't
#     create it
#   - nginx already configured on the VPS with root
#     <VPS_DEPLOY_PATH>/frontend/dist and proxying /api/ + /uploads/ to the
#     backend's port (this workflow does not touch nginx config)
