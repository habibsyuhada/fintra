<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Fintra — aplikasi rekap keuangan pribadi" />
    <title>Fintra</title>
    <script>
      // Applied before React mounts so the picked theme renders on first
      // paint instead of flashing the default light theme.
      (function () {
        var validThemes = ['light', 'dark', 'dim', 'flat', 'cat']
        var theme = localStorage.getItem('fintra-theme')
        document.documentElement.setAttribute('data-theme', validThemes.indexOf(theme) !== -1 ? theme : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
